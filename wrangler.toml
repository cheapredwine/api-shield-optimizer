name = "api-shield-optimizer"
main = "src/worker.ts"
compatibility_date = "2026-07-29"

[observability]
enabled = true

[vars]
REQUIRE_CF_ACCESS = "1"
# Set to your Access app audience tag
ACCESS_AUD = ""
# Example: https://<team>.cloudflareaccess.com/cdn-cgi/access/certs
ACCESS_JWKS_URL = ""
# Required issuer value
ACCESS_ISSUER = ""
